name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cmake:
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -G Ninja -DLD2026_BUILD_TESTS=ON -DLD2026_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify Windows watcher backend
        if: runner.os == 'Windows'
        run: ctest --test-dir build -R ld_watch_windows_tests --output-on-failure

      - name: Windows verification note
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "This job verifies Windows compile/test behavior for Known Folders, atomic replace, Registry, autostart, policy, and ReadDirectoryChangesW watcher backend shapes."

  watcher-libuv:
    name: Watcher libuv backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y pkg-config libuv1-dev

      - name: Configure
        run: cmake -S . -B build-libuv -G Ninja -DLD2026_BUILD_TESTS=ON -DLD2026_BUILD_EXAMPLES=ON -DLD2026_WATCH_PREFER_LIBUV=ON

      - name: Build
        run: cmake --build build-libuv

      - name: Test
        run: ctest --test-dir build-libuv --output-on-failure

  fedora:
    name: Fedora CMake
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install build dependencies
        run: dnf install -y cmake gcc-c++ git ninja-build

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build-fedora -G Ninja -DLD2026_BUILD_TESTS=ON -DLD2026_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build-fedora

      - name: Test
        run: ctest --test-dir build-fedora --output-on-failure
