name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cmake:
    name: CMake (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(matrix.container) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-debug-static
            os: ubuntu-latest
            container: "null"
            build-dir: build-ubuntu-gcc-debug-static
            build-type: Debug
            shared-libs: OFF
            compiler-options: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            install-command: ""
          - name: ubuntu-clang-release-shared
            os: ubuntu-latest
            container: "null"
            build-dir: build-ubuntu-clang-release-shared
            build-type: Release
            shared-libs: ON
            compiler-options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            install-command: ""
          - name: ubuntu-22.04-gcc-release-static
            os: ubuntu-latest
            container: '{"image":"ubuntu:22.04"}'
            build-dir: build-ubuntu-2204-gcc-release-static
            build-type: Release
            shared-libs: OFF
            compiler-options: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            install-command: apt-get update && apt-get install -y cmake g++ git ninja-build
          - name: fedora-gcc-debug-shared
            os: ubuntu-latest
            container: '{"image":"fedora:latest"}'
            build-dir: build-fedora-gcc-debug-shared
            build-type: Debug
            shared-libs: ON
            compiler-options: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            install-command: dnf install -y cmake gcc-c++ git ninja-build
          - name: windows-msvc-debug-static
            os: windows-latest
            container: "null"
            build-dir: build-windows-msvc-debug-static
            build-type: Debug
            shared-libs: OFF
            compiler-options: ""
            install-command: ""
          - name: windows-msvc-release-static
            os: windows-latest
            container: "null"
            build-dir: build-windows-msvc-release-static
            build-type: Release
            shared-libs: OFF
            compiler-options: ""
            install-command: ""

    steps:
      - name: Install build dependencies
        if: ${{ matrix['install-command'] != '' }}
        run: ${{ matrix['install-command'] }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B ${{ matrix['build-dir'] }} -G Ninja
          -DLD2026_BUILD_TESTS=ON
          -DLD2026_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=${{ matrix['build-type'] }}
          -DBUILD_SHARED_LIBS=${{ matrix['shared-libs'] }}
          ${{ matrix['compiler-options'] }}

      - name: Build
        run: cmake --build ${{ matrix['build-dir'] }}

      - name: Test
        run: ctest --test-dir ${{ matrix['build-dir'] }} --output-on-failure

      - name: Verify Windows watcher backend
        if: runner.os == 'Windows'
        run: ctest --test-dir ${{ matrix['build-dir'] }} -R ld_watch_windows_tests --output-on-failure

      - name: Windows verification note
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "This job verifies Windows compile/test behavior for Known Folders, atomic replace, Registry, autostart, policy, and ReadDirectoryChangesW watcher backend shapes."

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-asan-ubsan
            build-dir: build-sanitizers-gcc
            compiler-options: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: clang-asan-ubsan
            build-dir: build-sanitizers-clang
            compiler-options: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
    env:
      CFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=0
      LSAN_OPTIONS: detect_leaks=0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B ${{ matrix['build-dir'] }} -G Ninja
          -DLD2026_BUILD_TESTS=ON
          -DLD2026_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Debug
          ${{ matrix['compiler-options'] }}

      - name: Build
        run: cmake --build ${{ matrix['build-dir'] }}

      - name: Test
        run: ctest --test-dir ${{ matrix['build-dir'] }} --output-on-failure

  watcher-libuv:
    name: Watcher libuv backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install libuv
        run: sudo apt-get update && sudo apt-get install -y pkg-config libuv1-dev

      - name: Configure
        run: cmake -S . -B build-libuv -G Ninja -DLD2026_BUILD_TESTS=ON -DLD2026_BUILD_EXAMPLES=ON -DLD2026_WATCH_PREFER_LIBUV=ON

      - name: Build
        run: cmake --build build-libuv

      - name: Test
        run: ctest --test-dir build-libuv --output-on-failure
