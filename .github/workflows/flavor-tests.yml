name: Flavor Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  flavor-tests:
    name: FlavorTests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Ubuntu
            os: ubuntu-latest
            container: ""
          - platform: Windows
            os: windows-latest
            container: ""
          - platform: Fedora
            os: ubuntu-latest
            container: fedora:latest

    defaults:
      run:
        working-directory: docs/FlavorTests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        if: matrix.container == ''
        run: cmake -S . -B build -G Ninja

      - name: Build
        if: matrix.container == ''
        run: cmake --build build

      - name: Test
        if: matrix.container == ''
        run: ctest --test-dir build --output-on-failure

      - name: Configure, build, and test in Fedora
        if: matrix.container != ''
        working-directory: .
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w /workspace/docs/FlavorTests
          ${{ matrix.container }}
          bash -lc
          "dnf install -y cmake gcc-c++ ninja-build &&
          cmake -S . -B build -G Ninja &&
          cmake --build build &&
          ctest --test-dir build --output-on-failure"
